<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt Markdown Editor</title>
<style>
  :root{
    --bg:#0d0f12;
    --panel:#11151a;
    --line:#232a33;
    --text:#e9edf1;
    --muted:#707985;

    --h1:#ff6b6b;
    --h2:#57a6ff;
    --h3:#56d6b3;
    --h4:#c792ea;
    --list:#8bd450;
    --bracket:#f0b45a;
    --customtag:#6fd3c8;
    --variable:#d27cff;

    --sidebar:188px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono","Noto Sans Mono CJK KR",monospace;
  }

  .app{
    height:100%;
    display:grid;
    grid-template-columns:var(--sidebar) 1fr;
    transition:grid-template-columns .18s ease;
  }

  .app.sidebar-closed{
    grid-template-columns:34px 1fr;
  }

  /* ───────── 왼쪽 카테고리 ───────── */

  .sidebar{
    min-width:0;
    border-right:1px solid var(--line);
    background:#0f1216;
    overflow:hidden;
    position:relative;
  }

  .side-inner{
    width:var(--sidebar);
    height:100%;
    padding:14px 12px 18px;
    overflow-y:auto;
    scrollbar-width:thin;
  }

  .sidebar-closed .side-inner{
    visibility:hidden;
    opacity:0;
  }

  .side-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
    height:24px;
  }

  .side-title{
    color:#8b949f;
    font:600 11px/1 system-ui,sans-serif;
    letter-spacing:.08em;
  }

  .close-side,
  .open-side{
    border:0;
    background:transparent;
    color:#69727d;
    cursor:pointer;
    padding:4px;
    font:16px/1 system-ui,sans-serif;
  }

  .close-side:hover,
  .open-side:hover{
    color:#fff;
  }

  .open-side{
    display:none;
    position:absolute;
    inset:10px auto auto 6px;
    z-index:3;
  }

  .sidebar-closed .open-side{display:block}

  .nav-group{
    padding:1px 0 11px;
    margin-bottom:10px;
    border-bottom:1px solid #1c2229;
  }

  .nav-group:last-child{
    border-bottom:0;
    margin-bottom:0;
  }

  .group-name{
    margin:0 6px 6px;
    color:#59626d;
    font:600 10px/1.3 system-ui,sans-serif;
  }

  .nav-item{
    width:100%;
    border:0;
    background:transparent;
    color:#89939e;
    text-align:left;
    border-radius:4px;
    padding:5px 7px;
    margin:0;
    cursor:pointer;
    font:12px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono","Noto Sans Mono CJK KR",monospace;
  }

  .nav-item:hover{
    background:#171c22;
    color:#d5dae0;
  }

  .nav-item.exists{
    color:#c8cfd7;
  }

  .nav-item.active{
    color:var(--bracket);
    background:#171c22;
  }

  /* ───────── 편집기 ───────── */

  .main{
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:14px 16px 16px;
  }

  .top{
    min-height:34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:8px;
  }

  .title{
    color:#8b949f;
    font:600 12px/1 system-ui,sans-serif;
    letter-spacing:.02em;
  }

  .title-area{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
  }

  .meta-input{
    height:26px;
    border:1px solid var(--line);
    background:#0f1216;
    color:#c8cfd7;
    border-radius:5px;
    padding:0 7px;
    outline:none;
    font:11px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono","Noto Sans Mono CJK KR",monospace;
  }

  .meta-input:focus{
    border-color:#39434f;
  }

  .meta-input::placeholder{
    color:#525c67;
  }

  .title-input{width:120px}
  .version-input{width:68px}

  .actions{
    display:flex;
    align-items:center;
    gap:5px;
  }

  .actions button{
    border:1px solid var(--line);
    background:transparent;
    color:#8e98a3;
    border-radius:5px;
    padding:5px 8px;
    font:11px/1 system-ui,sans-serif;
    cursor:pointer;
  }

  .actions button:hover{
    background:#171c22;
    color:#fff;
  }


  .search-panel{
    flex:0 0 auto;
    margin-bottom:7px;
  }

  .search-panel[hidden]{
    display:none;
  }

  .search-row{
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
  }

  .search-row input{
    height:29px;
    min-width:0;
    border:1px solid var(--line);
    background:#0f1216;
    color:#c8cfd7;
    border-radius:5px;
    padding:0 8px;
    outline:none;
    font:12px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono","Noto Sans Mono CJK KR",monospace;
  }

  .search-row input:focus{
    border-color:#465261;
  }

  .search-input{
    width:min(260px, 28vw);
  }

  .replace-input{
    width:min(260px, 28vw);
    margin-left:5px;
  }

  .search-row button{
    flex:0 0 auto;
    height:29px;
    border:1px solid var(--line);
    background:transparent;
    color:#8e98a3;
    border-radius:5px;
    padding:0 8px;
    cursor:pointer;
    font:11px/1 system-ui,sans-serif;
  }

  .search-row button:hover{
    background:#171c22;
    color:#fff;
  }

  .search-count{
    min-width:42px;
    color:#66717d;
    text-align:center;
    font:10px/1 system-ui,sans-serif;
    white-space:nowrap;
  }

  .search-close{
    margin-left:auto;
    width:29px;
    padding:0 !important;
    font-size:17px !important;
  }

  .editor{
    position:relative;
    flex:1;
    min-height:0;
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    background:var(--panel);
  }

  #highlight,
  #input{
    position:absolute;
    inset:0;
    margin:0;
    border:0;
    padding:18px 20px 48px;

    /* 두 레이어가 같은 폭으로 줄바꿈되도록 스크롤 영역까지 동일하게 유지 */
    overflow-x:auto;
    overflow-y:scroll;
    scrollbar-gutter:stable;
    scrollbar-width:thin;

    white-space:pre-wrap;
    overflow-wrap:break-word;
    word-break:normal;
    tab-size:2;

    font:15px/1.72 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono","Noto Sans Mono CJK KR",monospace;
    font-variant-ligatures:none;
    letter-spacing:normal;
    word-spacing:normal;
    text-align:left;
    text-indent:0;
    text-transform:none;
  }

  #highlight{
    pointer-events:none;
    color:var(--text);
    scrollbar-color:transparent transparent;
  }

  #input{
    resize:none;
    outline:none;
    background:transparent;
    color:transparent;
    caret-color:#fff;
    -webkit-text-fill-color:transparent;
    scrollbar-color:#3a424c transparent;
  }

  /* Chromium / Safari에서도 두 레이어의 스크롤바 폭을 동일하게 예약 */
  #highlight::-webkit-scrollbar,
  #input::-webkit-scrollbar{
    width:10px;
    height:10px;
  }

  #highlight::-webkit-scrollbar-track,
  #highlight::-webkit-scrollbar-thumb{
    background:transparent;
  }

  #input::-webkit-scrollbar-track{
    background:transparent;
  }

  #input::-webkit-scrollbar-thumb{
    background:#343c46;
    border:2px solid transparent;
    background-clip:padding-box;
    border-radius:999px;
  }

  #input::selection{
    background:rgba(240,180,90,.23);
  }

  .hash.h1{color:var(--h1)}
  .hash.h2{color:var(--h2)}
  .hash.h3{color:var(--h3)}
  .hash.h4{color:var(--h4)}

  /* 표시 레이어는 색만 바꾼다. 굵기를 바꾸면 일부 PC/모바일 폰트에서
     실제 textarea와 글자 폭이 달라져 커서가 밀릴 수 있다. */
  .heading.h1,
  .heading.h2,
  .heading.h3,
  .heading.h4{font-weight:inherit}

  .dash{color:var(--list)}
  .bracket{color:var(--bracket)}
  .custom-tag{color:var(--customtag)}
  .variable{color:var(--variable)}

  .section-line{
    position:relative;
  }

  .section-line.folded::after{
    content:"접힘";
    position:absolute;
    left:calc(100% + 8px);
    top:50%;
    transform:translateY(-50%);
    padding:2px 5px;
    border:1px solid #2a323c;
    border-radius:4px;
    background:#151a20;
    color:#68727e;
    font:9px/1 system-ui,sans-serif;
    white-space:nowrap;
  }

  .hint{
    position:absolute;
    right:11px;
    bottom:9px;
    padding:4px 6px;
    border-radius:4px;
    background:rgba(17,21,26,.86);
    color:#59636e;
    font:10px/1 system-ui,sans-serif;
    pointer-events:none;
  }

  .not-found{
    animation:flash .32s ease;
  }

  @keyframes flash{
    50%{background:#2a1919}
  }


  .mobile-menu-btn{
    display:none;
    border:0;
    background:transparent;
    color:#8b949f;
    padding:3px 4px 3px 0;
    cursor:pointer;
    font:18px/1 system-ui,sans-serif;
  }

  .mobile-menu-btn:hover{
    color:#fff;
  }

  .sidebar-backdrop{
    display:none;
  }

  @media(max-width:720px){
    :root{--sidebar:min(82vw, 280px)}

    body{
      overflow:hidden;
    }

    .app,
    .app.sidebar-closed{
      display:block;
      height:100dvh;
    }

    .main{
      width:100%;
      height:100dvh;
      padding:8px;
    }

    .top{
      min-height:auto;
      margin-bottom:7px;
      flex-wrap:wrap;
      gap:7px;
    }

    .title-area{
      width:100%;
      gap:6px;
    }

    .mobile-menu-btn{
      display:block;
      flex:0 0 auto;
    }

    .title{
      margin-right:auto;
      white-space:nowrap;
    }

    .meta-input{
      height:28px;
      min-width:0;
      padding:0 6px;
      font-size:12px;
    }

    .title-input{
      width:min(34vw, 150px);
    }

    .version-input{
      width:min(20vw, 78px);
    }

    .actions{
      width:100%;
      gap:5px;
      overflow-x:auto;
      padding-bottom:1px;
      scrollbar-width:none;
    }

    .actions::-webkit-scrollbar{
      display:none;
    }

    .actions button{
      flex:0 0 auto;
      min-height:30px;
      padding:6px 9px;
      font-size:11px;
    }

    .editor{
      border-radius:5px;
    }

    #highlight,
    #input{
      padding:14px 12px 46px;
      font-size:14px;
      line-height:1.68;
      overscroll-behavior:contain;
    }

    #highlight::-webkit-scrollbar,
    #input::-webkit-scrollbar{
      width:7px;
      height:7px;
    }

    .hint{
      right:8px;
      bottom:7px;
      max-width:calc(100% - 16px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* 모바일에서는 왼쪽 카테고리를 오버레이 드로어로 사용 */
    .sidebar{
      position:fixed;
      z-index:30;
      inset:0 auto 0 0;
      width:var(--sidebar);
      border-right:1px solid var(--line);
      box-shadow:10px 0 30px rgba(0,0,0,.28);
      transform:translateX(0);
      transition:transform .18s ease;
      overflow:hidden;
    }

    .side-inner{
      width:100%;
      padding:12px 10px 18px;
    }

    .app.sidebar-closed .sidebar{
      transform:translateX(-100%);
    }

    .app.sidebar-closed .side-inner{
      visibility:visible;
      opacity:1;
    }

    /* 데스크톱용 얇은 열기 버튼은 모바일에서는 사용하지 않음 */
    .open-side,
    .sidebar-closed .open-side{
      display:none;
    }

    .sidebar-backdrop{
      display:block;
      position:fixed;
      z-index:20;
      inset:0;
      background:rgba(0,0,0,.42);
      opacity:1;
      pointer-events:auto;
      transition:opacity .18s ease;
    }

    .app.sidebar-closed .sidebar-backdrop{
      opacity:0;
      pointer-events:none;
    }

    .nav-item{
      padding:8px 8px;
      font-size:13px;
    }

    .group-name{
      margin:0 7px 5px;
      font-size:10px;
    }

    .nav-group{
      padding-bottom:9px;
      margin-bottom:8px;
    }
  }

  @media(max-width:420px){
    .main{
      padding:6px;
    }

    .title-area{
      gap:5px;
    }

    .title{
      font-size:11px;
    }

    .title-input{
      width:31vw;
    }

    .version-input{
      width:19vw;
    }

    #highlight,
    #input{
      padding:12px 10px 44px;
      font-size:13.5px;
    }

    .hint{
      font-size:9px;
    }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar">
    <button class="open-side" id="openSide" aria-label="카테고리 열기">›</button>

    <div class="side-inner">
      <div class="side-top">
        <div class="side-title">CATEGORY</div>
        <button class="close-side" id="closeSide" aria-label="카테고리 접기">‹</button>
      </div>

      <nav id="categoryNav">
        <div class="nav-group">
          <div class="group-name">인물</div>
          <button class="nav-item" data-tag="[인물 공개]">[인물 공개]</button>
          <button class="nav-item" data-tag="[인물 비공개]">[인물 비공개]</button>
          <button class="nav-item" data-tag="[관계 역학]">[관계 역학]</button>
        </div>

        <div class="nav-group">
          <div class="group-name">세계관</div>
          <button class="nav-item" data-tag="[세계관 공개]">[세계관 공개]</button>
          <button class="nav-item" data-tag="[세계관 비공개]">[세계관 비공개]</button>
        </div>

        <div class="nav-group">
          <div class="group-name">설정</div>
          <button class="nav-item" data-tag="[로어북]">[로어북]</button>
          <button class="nav-item" data-tag="[용어]">[용어]</button>
        </div>

        <div class="nav-group">
          <div class="group-name">지침</div>
          <button class="nav-item" data-tag="[출력 지침]">[출력 지침]</button>
          <button class="nav-item" data-tag="[서술 지침]">[서술 지침]</button>
          <button class="nav-item" data-tag="[서사 지침]">[서사 지침]</button>
          <button class="nav-item" data-tag="[연기 지침]">[연기 지침]</button>
        </div>

        <div class="nav-group">
          <div class="group-name">시스템</div>
          <button class="nav-item" data-tag="[상태창]">[상태창]</button>
          <button class="nav-item" data-tag="[변수]">[변수]</button>
          <button class="nav-item" data-tag="[명령어]">[명령어]</button>
        </div>

        <div class="nav-group">
          <div class="group-name">부가</div>
          <button class="nav-item" data-tag="[인트로]">[인트로]</button>
          <button class="nav-item" data-tag="[코멘트]">[코멘트]</button>
          <button class="nav-item" data-tag="[HTML]">[HTML]</button>
          <button class="nav-item" data-tag="[설명글]">[설명글]</button>
        </div>
      </nav>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main">
    <div class="top">
      <div class="title-area">
        <button id="mobileMenuBtn" class="mobile-menu-btn" type="button" aria-label="카테고리 열기">☰</button>
        <div class="title">Prompt Markdown</div>
        <input id="docTitle" class="meta-input title-input" type="text" placeholder="제목" aria-label="저장 제목">
        <input id="docVersion" class="meta-input version-input" type="text" placeholder="버전" aria-label="저장 버전">
      </div>
      <div class="actions">
        <button id="searchBtn" type="button">검색</button>
        <button id="copyBtn" type="button">복사</button>
        <button id="saveTxtBtn" type="button">TXT 저장</button>
        <button id="clearBtn" type="button">비우기</button>
        <button id="homeBtn" type="button">첫화면</button>
      </div>
    </div>

    <div class="search-panel" id="searchPanel" hidden>
      <div class="search-row">
        <input id="searchInput" class="search-input" type="text"
          placeholder="검색" aria-label="검색어">
        <button id="searchPrevBtn" type="button" title="이전 결과">↑</button>
        <button id="searchNextBtn" type="button" title="다음 결과">↓</button>
        <span id="searchCount" class="search-count">0/0</span>

        <input id="replaceInput" class="replace-input" type="text"
          placeholder="바꾸기" aria-label="바꿀 내용">
        <button id="replaceOneBtn" type="button">바꾸기</button>
        <button id="replaceAllBtn" type="button">모두</button>
        <button id="searchCloseBtn" class="search-close" type="button"
          aria-label="검색 닫기">×</button>
      </div>
    </div>

    <div class="editor" id="editor">
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="input" aria-label="프롬프트 편집기" spellcheck="false"></textarea>
      <div class="hint" id="editorHint">[카테고리]·|태그| 글자 클릭 → 접기</div>
    </div>
  </main>

</div>

<script>
const KNOWN_TAGS = [
  '[인물 공개]','[인물 비공개]','[관계 역학]',
  '[세계관 공개]','[세계관 비공개]',
  '[로어북]','[용어]',
  '[출력 지침]','[서술 지침]','[서사 지침]','[연기 지침]',
  '[상태창]','[변수]','[명령어]',
  '[인트로]','[코멘트]','[HTML]','[설명글]'
];

const KNOWN_SET = new Set(KNOWN_TAGS);

/* 사용자 정의 태그는 한 줄 전체가 |태그| 형태일 때만 인식한다.
   | a | b | 같은 표 형태는 태그로 오인하지 않도록 내부 | 문자는 허용하지 않는다. */
const CUSTOM_TAG_ONLY_RE = /^\|[^|\r\n]+\|$/;

function tagInfoFromLine(line){
  const trimmed = line.trim();

  if(KNOWN_SET.has(trimmed)){
    return {tag:trimmed, kind:'fixed'};
  }

  if(CUSTOM_TAG_ONLY_RE.test(trimmed)){
    return {tag:trimmed, kind:'custom'};
  }

  return null;
}

function sectionKey(kind,tag,occurrence){
  /* 기존 v9의 접힘 상태와 호환되도록 고정 카테고리 키는 그대로 유지 */
  return kind === 'fixed'
    ? `${tag}::${occurrence}`
    : `pipe:${tag}::${occurrence}`;
}

/* 첫화면은 그룹 사이에만 한 줄을 비운다.
   카테고리마다 빈 줄을 억지로 넣지 않는다. */
const sample = `[인물 공개]
[인물 비공개]
[관계 역학]

[세계관 공개]
[세계관 비공개]

[로어북]
[용어]

[출력 지침]
[서술 지침]
[서사 지침]
[연기 지침]

[상태창]
[변수]
[명령어]

[인트로]
[코멘트]
[HTML]
[설명글]`;

const app = document.getElementById('app');
const mobileMenuBtn = document.getElementById('mobileMenuBtn');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const input = document.getElementById('input');
const highlight = document.getElementById('highlight');
const editor = document.getElementById('editor');

const openSide = document.getElementById('openSide');

const safeStorage = {
  get(key){
    try{
      return window.localStorage.getItem(key);
    }catch(e){
      return null;
    }
  },
  set(key,value){
    try{
      window.localStorage.setItem(key,value);
      return true;
    }catch(e){
      return false;
    }
  }
};

function escapeRegex(text){
  return text.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
}

const FIXED_TAG_PATTERN = KNOWN_TAGS.map(escapeRegex).join('|');
const SECTION_LINE_SOURCE =
  `^(?:${FIXED_TAG_PATTERN}|[\\t ]*\\|[^|\\r\\n]+\\|[\\t ]*)$`;

let rawText = safeStorage.get('prompt-markdown-text');
if(rawText === null) rawText = sample;

let collapsedKeys = new Set();
try{
  const storedFold = JSON.parse(safeStorage.get('prompt-folded-sections') || '[]');
  if(Array.isArray(storedFold)) collapsedKeys = new Set(storedFold);
}catch(e){}

docTitle.value = safeStorage.get('prompt-doc-title') ?? '';
docVersion.value = safeStorage.get('prompt-doc-version') ?? '';

let saveTimer = null;
let lastHit = new Map();

let history = [rawText];
let historyIndex = 0;
let restoringHistory = false;

/* ───────── 문서 파싱 ───────── */

function parseText(text){
  const matches = [...text.matchAll(new RegExp(SECTION_LINE_SOURCE,'gm'))];
  const prefixEnd = matches.length ? matches[0].index : text.length;

  const parsed = {
    prefix:text.slice(0,prefixEnd),
    sections:[]
  };

  const counts = new Map();

  for(let i=0;i<matches.length;i++){
    const match = matches[i];
    const next = matches[i+1];

    const header = match[0];
    const info = tagInfoFromLine(header);

    /* 정규식과 tagInfo가 같은 규칙을 쓰지만 방어적으로 확인 */
    if(!info) continue;

    const {tag,kind} = info;
    const countKey = `${kind}:${tag}`;
    const occurrence = counts.get(countKey) ?? 0;
    counts.set(countKey,occurrence + 1);

    const bodyStart = match.index + header.length;
    const bodyEnd = next ? next.index : text.length;

    parsed.sections.push({
      tag,
      kind,
      key:sectionKey(kind,tag,occurrence),
      occurrence,
      header,
      headerStart:match.index,
      headerEnd:bodyStart,
      bodyStart,
      bodyEnd,
      body:text.slice(bodyStart,bodyEnd)
    });
  }

  return parsed;
}
function firstLineBreak(body){
  if(body.startsWith('\r\n')) return '\r\n';
  if(body.startsWith('\n')) return '\n';
  if(body.startsWith('\r')) return '\r';
  return '';
}

function buildView(text){
  const parsed = parseText(text);
  let view = parsed.prefix;
  const meta = [];

  for(const section of parsed.sections){
    const headerStart = view.length;
    view += section.header;
    const headerEnd = view.length;

    const folded = collapsedKeys.has(section.key);

    meta.push({
      tag:section.tag,
      kind:section.kind,
      key:section.key,
      occurrence:section.occurrence,
      headerStart,
      headerEnd,
      folded
    });

    if(folded){
      view += firstLineBreak(section.body);
    }else{
      view += section.body;
    }
  }

  return {text:view,meta};
}

/* 접힌 구역은 textarea에서 몸통이 안 보이므로,
   사용자가 보이는 부분을 편집해도 숨겨둔 원문 몸통은 유지해서 다시 합친다. */
function mergeVisibleIntoRaw(visibleText){
  const oldParsed = parseText(rawText);
  const oldMap = new Map(oldParsed.sections.map(s => [s.key,s]));
  const visibleParsed = parseText(visibleText);

  let merged = visibleParsed.prefix;

  for(const section of visibleParsed.sections){
    merged += section.header;

    if(collapsedKeys.has(section.key) && oldMap.has(section.key)){
      merged += oldMap.get(section.key).body;
    }else{
      merged += section.body;
    }
  }

  rawText = merged;
  pruneCollapsedKeys();
}

function pruneCollapsedKeys(){
  const valid = new Set(parseText(rawText).sections.map(s => s.key));
  collapsedKeys = new Set([...collapsedKeys].filter(key => valid.has(key)));
  saveCollapsed();
}

function saveCollapsed(){
  safeStorage.set('prompt-folded-sections',JSON.stringify([...collapsedKeys]));
}


/* ───────── 고정 카테고리 보호 ───────── */

function fixedSectionsFromText(text){
  return parseText(text).sections.filter(section => section.kind === 'fixed');
}

function hasCanonicalFixedFramework(text){
  const sequence = fixedSectionsFromText(text).map(section => section.tag);

  return sequence.length === KNOWN_TAGS.length &&
    sequence.every((tag,index) => tag === KNOWN_TAGS[index]);
}

function fixedSequence(text){
  return fixedSectionsFromText(text).map(section => section.tag);
}

function protectedViewRanges(){
  return buildView(rawText).meta
    .filter(item => item.kind === 'fixed')
    .map(item => {
      const start = item.headerStart;
      const end = item.headerEnd;

      let beforeStart = start;
      let afterEnd = end;

      /* 줄 자체가 무너지지 않도록 바로 앞/뒤 개행 문자도 삭제 보호 */
      if(start > 0){
        if(input.value[start - 1] === '\n'){
          beforeStart = start - 1;
          if(start > 1 && input.value[start - 2] === '\r'){
            beforeStart = start - 2;
          }
        }else if(input.value[start - 1] === '\r'){
          beforeStart = start - 1;
        }
      }

      if(input.value[end] === '\r' && input.value[end + 1] === '\n'){
        afterEnd = end + 2;
      }else if(input.value[end] === '\n' || input.value[end] === '\r'){
        afterEnd = end + 1;
      }

      return {
        start,
        end,
        beforeStart,
        afterEnd
      };
    });
}

function rangesOverlap(aStart,aEnd,bStart,bEnd){
  return aStart < bEnd && aEnd > bStart;
}

function selectionTouchesProtectedStructure(start,end){
  return protectedViewRanges().some(range =>
    rangesOverlap(start,end,range.beforeStart,range.afterEnd)
  );
}

function caretInsideProtectedHeader(pos){
  return protectedViewRanges().some(range =>
    pos > range.start && pos < range.end
  );
}

function caretAtProtectedBoundary(pos){
  return protectedViewRanges().some(range =>
    pos === range.start || pos === range.end
  );
}

function deletionTouchesProtectedStructure(inputType,start,end){
  if(start !== end){
    return selectionTouchesProtectedStructure(start,end);
  }

  const ranges = protectedViewRanges();

  if(inputType.includes('Backward')){
    const dStart = Math.max(0,start - 1);
    return ranges.some(range =>
      rangesOverlap(dStart,start,range.beforeStart,range.afterEnd)
    );
  }

  if(inputType.includes('Forward') || inputType.startsWith('delete')){
    const dEnd = Math.min(input.value.length,start + 1);
    return ranges.some(range =>
      rangesOverlap(start,dEnd,range.beforeStart,range.afterEnd)
    );
  }

  return false;
}

let hintTimer = null;

function showProtectedHint(message='고정 카테고리는 수정·삭제할 수 없음'){
  clearTimeout(hintTimer);

  const original = '[카테고리]·|태그| 글자 클릭 → 접기';
  editorHint.textContent = message;
  editorHint.style.color = '#d7a55e';

  hintTimer = setTimeout(() => {
    editorHint.textContent = original;
    editorHint.style.color = '';
  },1200);
}

function rawRangeTouchesFixed(start,end){
  return fixedSectionsFromText(rawText).some(section =>
    rangesOverlap(start,end,section.headerStart,section.headerEnd)
  );
}

/* ───────── 하이라이트 ───────── */

function esc(s){
  return s.replace(/[&<>"]/g,ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
  })[ch]);
}

function inlineSyntax(text){
  let out = '';
  let i = 0;

  while(i < text.length){
    if(text.startsWith('{{',i)){
      const end = text.indexOf('}}',i+2);
      if(end !== -1){
        out += '<span class="variable">' + esc(text.slice(i,end+2)) + '</span>';
        i = end + 2;
        continue;
      }
    }

    if(text[i] === '['){
      const end = text.indexOf(']',i+1);
      if(end !== -1){
        out += '<span class="bracket">' + esc(text.slice(i,end+1)) + '</span>';
        i = end + 1;
        continue;
      }
    }

    out += esc(text[i]);
    i++;
  }

  return out;
}

function renderHighlight(){
  const lines = input.value.split('\n');
  const counts = new Map();

  highlight.innerHTML = lines.map(line => {
    const info = tagInfoFromLine(line);

    if(info){
      const countKey = `${info.kind}:${info.tag}`;
      const occurrence = counts.get(countKey) ?? 0;
      counts.set(countKey,occurrence + 1);

      const key = sectionKey(info.kind,info.tag,occurrence);
      const folded = collapsedKeys.has(key);

      if(info.kind === 'fixed'){
        const cls = folded
          ? 'section-line bracket folded'
          : 'section-line bracket';
        return `<span class="${cls}">${esc(line)}</span>`;
      }

      const cls = folded
        ? 'section-line custom-tag folded'
        : 'section-line custom-tag';
      return `<span class="${cls}">${esc(line)}</span>`;
    }

    const heading = line.match(/^(\s*)(#{1,4})(\s+)(.*)$/);
    if(heading){
      const [,indent,hashes,gap,body] = heading;
      const level = 'h' + hashes.length;

      return esc(indent)
        + `<span class="hash ${level}">${esc(hashes)}</span>`
        + esc(gap)
        + `<span class="heading ${level}">${inlineSyntax(body)}</span>`;
    }

    const list = line.match(/^(\s*)(-)(\s+)(.*)$/);
    if(list){
      const [,indent,dash,gap,body] = list;

      return esc(indent)
        + `<span class="dash">${dash}</span>`
        + esc(gap)
        + inlineSyntax(body);
    }

    /* [직업], [성격] 등 사용자가 직접 쓴 []는 섹션이 아니라 일반 텍스트.
       기존 가독성 색상만 유지한다. */
    return inlineSyntax(line);
  }).join('\n') + '\n';

  syncScroll();
}
function applyView(selectionIndex=null){
  const view = buildView(rawText);
  input.value = view.text;
  renderHighlight();
  refreshNav();

  if(selectionIndex !== null){
    const pos = Math.max(0,Math.min(selectionIndex,input.value.length));
    input.setSelectionRange(pos,pos);
  }
}

/* ───────── 저장 / 히스토리 ───────── */

function saveNow(){
  safeStorage.set('prompt-markdown-text',rawText);
  saveCollapsed();
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow,180);
}

window.addEventListener('beforeunload',saveNow);

function pushHistory(){
  if(restoringHistory) return;

  if(history[historyIndex] === rawText) return;

  history = history.slice(0,historyIndex + 1);
  history.push(rawText);

  if(history.length > 300){
    history.shift();
  }else{
    historyIndex++;
  }

  if(history.length === 300){
    historyIndex = history.length - 1;
  }
}

function restoreHistory(index){
  if(index < 0 || index >= history.length) return;

  restoringHistory = true;
  historyIndex = index;
  rawText = history[historyIndex];
  pruneCollapsedKeys();
  applyView();
  saveNow();
  restoringHistory = false;
}

function undo(){
  if(historyIndex > 0) restoreHistory(historyIndex - 1);
}

function redo(){
  if(historyIndex < history.length - 1) restoreHistory(historyIndex + 1);
}

/* ───────── 스크롤 / 이동 ───────── */

function syncScroll(){
  highlight.scrollTop = input.scrollTop;
  highlight.scrollLeft = input.scrollLeft;
}

function measureIndexTop(index){
  const style = getComputedStyle(input);
  const mirror = document.createElement('div');

  mirror.setAttribute('aria-hidden','true');
  mirror.style.position = 'fixed';
  mirror.style.left = '-100000px';
  mirror.style.top = '0';
  mirror.style.visibility = 'hidden';
  mirror.style.pointerEvents = 'none';
  mirror.style.boxSizing = 'border-box';
  mirror.style.width = input.clientWidth + 'px';

  const props = [
    'fontFamily','fontSize','fontWeight','fontStyle','fontVariant',
    'fontStretch','lineHeight','letterSpacing','wordSpacing',
    'whiteSpace','overflowWrap','wordBreak','tabSize',
    'textAlign','textIndent','textTransform',
    'paddingTop','paddingRight','paddingBottom','paddingLeft'
  ];

  props.forEach(prop => {
    mirror.style[prop] = style[prop];
  });

  mirror.appendChild(document.createTextNode(input.value.slice(0,index)));

  const marker = document.createElement('span');
  marker.textContent = '\u200b';
  mirror.appendChild(marker);

  document.body.appendChild(mirror);
  const top = marker.offsetTop;
  mirror.remove();

  return top;
}

function scrollToIndex(index){
  const targetTop = measureIndexTop(index);
  const maxScroll = Math.max(0,input.scrollHeight - input.clientHeight);

  const desired = Math.min(
    maxScroll,
    Math.max(0,targetTop - input.clientHeight * 0.35)
  );

  input.scrollTo({
    top:desired,
    behavior:'smooth'
  });
}

function refreshNav(){
  const present = new Set(
    parseText(rawText).sections
      .filter(section => section.kind === 'fixed')
      .map(section => section.tag)
  );

  navItems.forEach(item => {
    const tag = item.dataset.tag;
    item.classList.toggle('exists',present.has(tag));

    if(!present.has(tag)){
      item.classList.remove('active');
      lastHit.delete(tag);
    }
  });
}

function goToTag(tag,button){
  const view = buildView(rawText);
  const matches = view.meta.filter(item =>
    item.kind === 'fixed' && item.tag === tag
  );

  if(!matches.length){
    editor.classList.remove('not-found');
    void editor.offsetWidth;
    editor.classList.add('not-found');
    button.classList.remove('active');
    return;
  }

  const previous = lastHit.get(tag) ?? -1;
  const next = (previous + 1) % matches.length;
  lastHit.set(tag,next);

  const hit = matches[next];

  navItems.forEach(item => item.classList.remove('active'));
  button.classList.add('active');

  input.focus({preventScroll:true});
  input.setSelectionRange(hit.headerStart,hit.headerEnd);
  scrollToIndex(hit.headerStart);
}

/* ───────── 접기 ───────── */

function sectionAtCaret(){
  const pos = input.selectionStart;
  const view = buildView(rawText);

  /* 헤더 문자열 "안쪽"을 눌렀을 때만 접는다.
     줄 끝의 빈 공간을 누르면 textarea의 caret이 headerEnd에 놓이므로,
     그 경우에는 접지 않고 그대로 엔터/입력이 가능하다. */
  return view.meta.find(item =>
    pos >= item.headerStart && pos < item.headerEnd
  ) || null;
}

function toggleFoldAtCaret(){
  if(input.selectionStart !== input.selectionEnd) return false;

  const section = sectionAtCaret();
  if(!section) return false;

  if(collapsedKeys.has(section.key)){
    collapsedKeys.delete(section.key);
  }else{
    collapsedKeys.add(section.key);
  }

  saveCollapsed();
  applyView(section.headerStart);

  input.focus({preventScroll:true});
  scrollToIndex(section.headerStart);
  return true;
}


/* ───────── 검색 / 바꾸기 ───────── */

let searchMatches = [];
let searchMatchIndex = -1;

function findAllMatches(query){
  if(!query) return [];

  const haystack = rawText.toLocaleLowerCase();
  const needle = query.toLocaleLowerCase();
  const matches = [];

  let from = 0;

  while(from <= haystack.length - needle.length){
    const start = haystack.indexOf(needle,from);
    if(start === -1) break;

    matches.push({
      start,
      end:start + query.length
    });

    /* 일반 편집기처럼 겹치는 검색 결과는 중복 집계하지 않는다. */
    from = start + Math.max(1,needle.length);
  }

  return matches;
}

function updateSearchCount(){
  const total = searchMatches.length;
  const current = total && searchMatchIndex >= 0
    ? searchMatchIndex + 1
    : 0;

  searchCount.textContent = `${current}/${total}`;
}

function refreshSearchMatches(resetIndex=false){
  searchMatches = findAllMatches(searchInput.value);

  if(resetIndex){
    searchMatchIndex = -1;
  }else if(searchMatchIndex >= searchMatches.length){
    searchMatchIndex = searchMatches.length - 1;
  }

  updateSearchCount();
}

function sectionForRawIndex(rawIndex){
  const parsed = parseText(rawText);

  return parsed.sections.find(section =>
    rawIndex >= section.headerStart &&
    rawIndex <= section.bodyEnd
  ) || null;
}

function rawIndexToViewIndex(rawIndex){
  const parsed = parseText(rawText);

  if(rawIndex <= parsed.prefix.length){
    return rawIndex;
  }

  let viewCursor = parsed.prefix.length;

  for(const section of parsed.sections){
    if(rawIndex < section.headerStart){
      return viewCursor;
    }

    if(rawIndex <= section.headerEnd){
      return viewCursor + (rawIndex - section.headerStart);
    }

    const hidden = collapsedKeys.has(section.key);
    const visibleBody = hidden
      ? firstLineBreak(section.body)
      : section.body;

    if(rawIndex <= section.bodyEnd){
      if(hidden){
        /* 검색 이동에서는 대상 섹션을 먼저 펼치므로 보통 이 분기는 타지 않는다. */
        return viewCursor + section.header.length + visibleBody.length;
      }

      return viewCursor
        + section.header.length
        + (rawIndex - section.bodyStart);
    }

    viewCursor += section.header.length + visibleBody.length;
  }

  return buildView(rawText).text.length;
}

function revealRawIndex(rawIndex){
  const section = sectionForRawIndex(rawIndex);

  if(section && collapsedKeys.has(section.key)){
    collapsedKeys.delete(section.key);
    saveCollapsed();
    applyView();
  }
}

function goToSearchMatch(index){
  if(!searchMatches.length) return;

  searchMatchIndex =
    (index + searchMatches.length) % searchMatches.length;

  const match = searchMatches[searchMatchIndex];

  /* 접힌 구역 내부의 검색 결과도 찾을 수 있게 자동으로 펼친다. */
  revealRawIndex(match.start);

  const viewStart = rawIndexToViewIndex(match.start);
  const viewEnd = rawIndexToViewIndex(match.end);

  input.focus({preventScroll:true});
  input.setSelectionRange(viewStart,viewEnd);
  scrollToIndex(viewStart);
  updateSearchCount();
}

function nextSearch(direction=1){
  refreshSearchMatches(false);

  if(!searchMatches.length){
    searchMatchIndex = -1;
    updateSearchCount();
    return;
  }

  if(searchMatchIndex < 0){
    goToSearchMatch(direction > 0 ? 0 : searchMatches.length - 1);
  }else{
    goToSearchMatch(searchMatchIndex + direction);
  }
}

function openSearch(focusReplace=false){
  searchPanel.hidden = false;

  requestAnimationFrame(() => {
    (focusReplace ? replaceInput : searchInput).focus();
    if(!focusReplace) searchInput.select();
  });

  refreshSearchMatches(false);
}

function closeSearch(){
  searchPanel.hidden = true;
  input.focus();
}

function replaceCurrent(){
  const query = searchInput.value;
  if(!query) return;

  refreshSearchMatches(false);

  if(!searchMatches.length) return;

  if(searchMatchIndex < 0){
    searchMatchIndex = 0;
  }

  const match = searchMatches[searchMatchIndex];

  if(rawRangeTouchesFixed(match.start,match.end)){
    showProtectedHint();

    if(searchMatches.length > 1){
      goToSearchMatch(searchMatchIndex + 1);
    }

    return;
  }

  const replacement = replaceInput.value;

  rawText =
    rawText.slice(0,match.start)
    + replacement
    + rawText.slice(match.end);

  pruneCollapsedKeys();
  applyView();
  pushHistory();
  saveNow();

  refreshSearchMatches(false);

  if(searchMatches.length){
    searchMatchIndex = Math.min(searchMatchIndex,searchMatches.length - 1);
    goToSearchMatch(searchMatchIndex);
  }else{
    searchMatchIndex = -1;
    updateSearchCount();
  }
}

function replaceAll(){
  const query = searchInput.value;
  if(!query) return;

  const allMatches = findAllMatches(query);
  const matches = allMatches.filter(match =>
    !rawRangeTouchesFixed(match.start,match.end)
  );

  if(!matches.length){
    if(allMatches.length) showProtectedHint();
    refreshSearchMatches(true);
    return;
  }

  const replacement = replaceInput.value;
  let result = '';
  let cursor = 0;

  /* 뒤에서 자르는 대신 원문을 순서대로 조립해서 replacement의 $, \ 같은 문자도
     특별한 의미 없이 그대로 들어가게 한다. */
  for(const match of matches){
    result += rawText.slice(cursor,match.start);
    result += replacement;
    cursor = match.end;
  }

  result += rawText.slice(cursor);

  rawText = result;
  pruneCollapsedKeys();
  applyView();
  pushHistory();
  saveNow();

  searchMatches = findAllMatches(query);
  searchMatchIndex = -1;
  updateSearchCount();

  const old = replaceAllBtn.textContent;
  replaceAllBtn.textContent = `${matches.length}개`;
  setTimeout(() => replaceAllBtn.textContent = old,850);
}

searchBtn.addEventListener('click',() => openSearch(false));
searchCloseBtn.addEventListener('click',closeSearch);
searchPrevBtn.addEventListener('click',() => nextSearch(-1));
searchNextBtn.addEventListener('click',() => nextSearch(1));
replaceOneBtn.addEventListener('click',replaceCurrent);
replaceAllBtn.addEventListener('click',replaceAll);

searchInput.addEventListener('input',() => {
  refreshSearchMatches(true);
});

searchInput.addEventListener('keydown',e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    nextSearch(e.shiftKey ? -1 : 1);
  }else if(e.key === 'Escape'){
    e.preventDefault();
    closeSearch();
  }
});

replaceInput.addEventListener('keydown',e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    replaceCurrent();
  }else if(e.key === 'Escape'){
    e.preventDefault();
    closeSearch();
  }
});


/* ───────── 입력 ───────── */

input.addEventListener('input', e => {
  /* beforeinput을 우회하는 일부 모바일 입력기의 안전장치.
     고정 카테고리의 순서/개수가 바뀌면 바로 직전 원문을 복원한다. */
  const previousRaw = rawText;
  const previousSelection = input.selectionStart;
  const beforeSequence = fixedSequence(previousRaw);

  mergeVisibleIntoRaw(input.value);

  const afterSequence = fixedSequence(rawText);
  const structureChanged =
    beforeSequence.length !== afterSequence.length ||
    beforeSequence.some((tag,index) => tag !== afterSequence[index]);

  if(structureChanged){
    rawText = previousRaw;
    applyView(Math.min(previousSelection,buildView(rawText).text.length));
    showProtectedHint();
    return;
  }

  renderHighlight();
  refreshNav();
  refreshSearchMatches(false);
  pushHistory();
  scheduleSave();
});

input.addEventListener('scroll',syncScroll);

input.addEventListener('click',() => {
  /* 일반 [직업], [성격]은 접지 않는다.
     왼쪽 카테고리에 등록된 최상위 [] 줄을 직접 클릭했을 때만 접는다. */
  toggleFoldAtCaret();
});

input.addEventListener('keydown',e => {
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();

  if(mod && !e.altKey && key === 'f'){
    e.preventDefault();
    openSearch(false);
    return;
  }

  if(mod && !e.altKey && key === 'h'){
    e.preventDefault();
    openSearch(true);
    return;
  }

  if(mod && !e.altKey && key === 'z'){
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }

  if(mod && !e.altKey && key === 'y'){
    e.preventDefault();
    redo();
    return;
  }

  if(e.key === 'Tab'){
    e.preventDefault();

    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.setRangeText('  ',start,end,'end');
    input.dispatchEvent(new InputEvent('input',{
      bubbles:true,
      inputType:'insertText',
      data:'  '
    }));
  }
});

input.addEventListener('beforeinput',e => {
  if(e.inputType === 'historyUndo'){
    e.preventDefault();
    undo();
    return;
  }

  if(e.inputType === 'historyRedo'){
    e.preventDefault();
    redo();
    return;
  }

  const start = input.selectionStart;
  const end = input.selectionEnd;
  const type = e.inputType || '';

  if(type.startsWith('delete')){
    if(deletionTouchesProtectedStructure(type,start,end)){
      e.preventDefault();
      showProtectedHint();
    }
    return;
  }

  if(type.startsWith('insert')){
    /* 선택 범위가 카테고리나 그 줄 경계를 포함하면 교체 금지 */
    if(start !== end && selectionTouchesProtectedStructure(start,end)){
      e.preventDefault();
      showProtectedHint();
      return;
    }

    if(start === end){
      /* 카테고리 글자 안에서는 입력 금지 */
      if(caretInsideProtectedHeader(start)){
        e.preventDefault();
        showProtectedHint();
        return;
      }

      /* 카테고리 앞/뒤 경계에서는 Enter만 허용.
         따라서 [인물 공개] 뒤를 클릭 → Enter → 내용 입력 흐름은 그대로 된다. */
      if(caretAtProtectedBoundary(start)){
        const isLineBreak =
          type === 'insertLineBreak' ||
          type === 'insertParagraph';

        if(!isLineBreak){
          e.preventDefault();
          showProtectedHint();
          return;
        }
      }
    }
  }
});

/* 전체 선택 후 붙여넣기:
   접힌 구역이 있어도 보이는 축약본이 아니라 새 원문 전체로 정확히 교체한다. */
input.addEventListener('paste',e => {
  const allSelected =
    input.selectionStart === 0 &&
    input.selectionEnd === input.value.length;

  if(!allSelected) return;

  const pasted = e.clipboardData?.getData('text/plain');
  if(typeof pasted !== 'string') return;

  /* Ctrl+A → 붙여넣기는 계속 지원한다.
     단, 고정 카테고리를 빼버린 문서로는 전체 구조를 덮어쓸 수 없다. */
  if(!hasCanonicalFixedFramework(pasted)){
    e.preventDefault();
    showProtectedHint('전체 붙여넣기에는 고정 카테고리가 필요함');
    return;
  }

  e.preventDefault();

  rawText = pasted;
  collapsedKeys.clear();
  lastHit.clear();
  applyView(0);
  refreshSearchMatches(true);
  pushHistory();
  saveNow();

  input.focus();
});

/* 전체 선택 복사도 접힌 구역을 빠뜨리지 않고 원문 전체를 복사한다. */
input.addEventListener('copy',e => {
  const allSelected =
    input.selectionStart === 0 &&
    input.selectionEnd === input.value.length;

  if(!allSelected || !e.clipboardData) return;

  e.preventDefault();
  e.clipboardData.setData('text/plain',rawText);
});

/* ───────── 버튼 ───────── */

navItems.forEach(item => {
  item.addEventListener('click',() => {
    goToTag(item.dataset.tag,item);

    if(isMobile()) closeSidebar();
  });
});

docTitle.addEventListener('input',() => {
  safeStorage.set('prompt-doc-title',docTitle.value);
});

docVersion.addEventListener('input',() => {
  safeStorage.set('prompt-doc-version',docVersion.value);
});

copyBtn.addEventListener('click',async () => {
  let copied = false;

  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(rawText);
      copied = true;
    }
  }catch(e){}

  if(!copied){
    const temp = document.createElement('textarea');
    temp.value = rawText;
    temp.style.position = 'fixed';
    temp.style.left = '-100000px';
    document.body.appendChild(temp);
    temp.select();

    try{
      copied = document.execCommand('copy');
    }catch(e){
      copied = false;
    }

    temp.remove();
  }

  const old = copyBtn.textContent;
  copyBtn.textContent = copied ? '복사됨' : '복사 실패';
  setTimeout(() => copyBtn.textContent = old,850);
});

saveTxtBtn.addEventListener('click',() => {
  const blob = new Blob([rawText],{type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const date = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;

  const clean = (value,fallback) => {
    const v = (value || '').trim()
      .replace(/[\\/:*?"<>|]/g,'-')
      .replace(/\s+/g,' ');
    return v || fallback;
  };

  const title = clean(docTitle.value,'제목');
  const version = clean(docVersion.value,'버전');

  a.href = url;
  a.download = `${title}_${version}_${date}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  const old = saveTxtBtn.textContent;
  saveTxtBtn.textContent = '저장됨';
  setTimeout(() => saveTxtBtn.textContent = old,850);
});

clearBtn.addEventListener('click',() => {
  /* 고정 카테고리는 삭제 대상이 아니므로 비우기는 카테고리 골격만 남긴다. */
  rawText = sample;
  collapsedKeys.clear();
  lastHit.clear();

  applyView(0);
  refreshSearchMatches(true);
  pushHistory();
  saveNow();

  input.focus();
});

homeBtn.addEventListener('click',() => {
  rawText = sample;
  collapsedKeys.clear();
  lastHit.clear();

  navItems.forEach(item => item.classList.remove('active'));

  applyView(0);
  refreshSearchMatches(true);
  input.scrollTop = 0;
  highlight.scrollTop = 0;

  pushHistory();
  saveNow();
  input.focus();
});

/* ───────── 사이드바 / 모바일 ───────── */

function isMobile(){
  return window.matchMedia('(max-width:720px)').matches;
}

function closeSidebar(){
  app.classList.add('sidebar-closed');

  if(isMobile()){
    safeStorage.set('prompt-mobile-sidebar-closed','1');
  }else{
    safeStorage.set('prompt-sidebar-closed','1');
  }
}

function openSidebar(){
  app.classList.remove('sidebar-closed');

  if(isMobile()){
    safeStorage.set('prompt-mobile-sidebar-closed','0');
  }else{
    safeStorage.set('prompt-sidebar-closed','0');
  }
}

closeSide.addEventListener('click',closeSidebar);
openSide.addEventListener('click',openSidebar);
mobileMenuBtn.addEventListener('click',openSidebar);
sidebarBackdrop.addEventListener('click',closeSidebar);

function applyResponsiveSidebarState(){
  if(isMobile()){
    const state = safeStorage.get('prompt-mobile-sidebar-closed');

    if(state === null || state === '1'){
      app.classList.add('sidebar-closed');
    }else{
      app.classList.remove('sidebar-closed');
    }
  }else{
    if(safeStorage.get('prompt-sidebar-closed') === '1'){
      app.classList.add('sidebar-closed');
    }else{
      app.classList.remove('sidebar-closed');
    }
  }
}

let lastMobileMode = isMobile();
applyResponsiveSidebarState();

window.addEventListener('resize',() => {
  const current = isMobile();

  if(current !== lastMobileMode){
    lastMobileMode = current;
    applyResponsiveSidebarState();
  }

  requestAnimationFrame(syncScroll);
});

/* ───────── 초기화 ───────── */

applyView();

/* 개발 검증용. 화면에는 노출되지 않는다. */
window.__editorTest = {
  getRaw:() => rawText,
  getView:() => input.value,
  getCollapsed:() => [...collapsedKeys],
  setRaw(text){
    rawText = text;
    collapsedKeys.clear();
    applyView();
    history = [rawText];
    historyIndex = 0;
  },
  fold(tag,occurrence=0){
    const kind = KNOWN_SET.has(tag) ? 'fixed' : 'custom';
    const key = sectionKey(kind,tag,occurrence);

    if(collapsedKeys.has(key)){
      collapsedKeys.delete(key);
    }else{
      collapsedKeys.add(key);
    }

    applyView();
  },
  clear(){
    rawText = '';
    collapsedKeys.clear();
    applyView();
  },
  sample:() => sample,
  parse:parseText,
  fixedSequence:() => fixedSequence(rawText),
  canonicalFramework:() => hasCanonicalFixedFramework(rawText),
  customTags:() => parseText(rawText).sections
    .filter(section => section.kind === 'custom')
    .map(section => section.tag),
  search(query){
    return findAllMatches(query);
  },
  replaceAll(query,replacement){
    searchInput.value = query;
    replaceInput.value = replacement;
    replaceAll();
    return rawText;
  }
};
